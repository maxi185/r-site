<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabinet Dentaire — Prise de rendez-vous</title>
<style>
:root{--bg:#f3f7f6;--card:#fff;--ink:#12302f;--mute:#5d7776;--line:#d5e2e0;--accent:#0f6b66}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,"Segoe UI",system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;width:100%;max-width:420px}
h1{font-size:26px;margin:0 0 4px}
h2{font-size:17px;margin:0}
.lead{color:var(--mute);margin:0 0 20px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:14px}
input,select{display:block;width:100%;margin-top:6px;padding:11px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
button{width:100%;padding:13px;font:inherit;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:8px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:22px;margin:0 0 8px;font-size:14px}
.msg.ok{color:#1b7f4b}.msg.ko{color:#c0392b}
.hp{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="card">
  <h1>🦷 Cabinet Dentaire</h1>
  <h2>Bienvenue</h2>
  <p class="lead">Prenez votre rendez-vous en ligne.</p>
  <label>Nom<input id="nom" autocomplete="name"></label>
  <label>Téléphone<input id="tel" type="tel" inputmode="tel" autocomplete="tel"></label>
  <label>Service
    <select id="svc"><option>Détartrage</option><option>Consultation</option><option>Soin de carie</option><option>Blanchiment</option><option>Orthodontie</option></select>
  </label>
  <label>Date souhaitée<input id="date" type="date"></label>
  <input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
  <p class="msg" id="msg" role="status"></p>
  <button id="btn">Prendre rendez-vous</button>
</div>
<script>
// Colle ici l'URL de déploiement Apps Script (elle se termine par /exec)
var ENDPOINT = "https://script.google.com/macros/s/AKfycbzyFOIN7EBoWXHWN_22aCWxnhLgZIfnBTU5P_HrjE72I14e84ONVczendPBcNWukKMr/exec";

var $ = function(i){return document.getElementById(i)};
var t = new Date(); t.setDate(t.getDate()+1);
$("date").min = new Date().toISOString().slice(0,10);
$("date").value = t.toISOString().slice(0,10);

$("btn").addEventListener("click", function(){
  var nom=$("nom").value.trim(), tel=$("tel").value.trim(), svc=$("svc").value, d=$("date").value, msg=$("msg");
  if($("hp").value) return; // anti-spam
  if(!nom||!tel||!d){msg.className="msg ko";msg.textContent="Merci de remplir tous les champs.";return}
  var p=d.split("-"), date=p[2]+"/"+p[1]+"/"+p[0];
  $("btn").disabled=true; msg.className="msg"; msg.textContent="Envoi…";
  // no-cors : la réponse est opaque, on considère l'envoi réussi s'il n'y a pas d'erreur réseau
  fetch(ENDPOINT,{method:"POST",mode:"no-cors",body:new URLSearchParams({nom:nom,tel:tel,service:svc,date:date})})
    .then(function(){
      msg.className="msg ok"; msg.textContent="Merci "+nom+" ! Votre demande est envoyée, le cabinet vous contactera.";
      $("nom").value=""; $("tel").value="";
    })
    .catch(function(){ msg.className="msg ko"; msg.textContent="Envoi impossible. Réessayez ou appelez le cabinet."; })
    .finally(function(){ $("btn").disabled=false; });
});
</script>
</body>
</html>
